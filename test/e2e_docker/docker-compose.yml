services:
  gitlab:
    image: gitlab/gitlab-ce:17.11.0-ce.0
    platform: linux/amd64
    hostname: gitlab.local
    environment:
      GITLAB_ROOT_PASSWORD: "e2e-test-password-123"
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://localhost:80'
        gitlab_rails['initial_root_password'] = 'e2e-test-password-123'
        puma['worker_processes'] = 0
        sidekiq['concurrency'] = 2
        prometheus_monitoring['enable'] = false
        gitlab_kas['enable'] = false
        sentinel['enable'] = false
        gitlab_pages['enable'] = false
        registry['enable'] = false
    ports:
      - "8929:80"
    volumes:
      - gitlab-config:/etc/gitlab
      - gitlab-data:/var/opt/gitlab
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:80/-/readiness?all=1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 180s
    networks:
      - e2e

  gitlab-runner:
    image: gitlab/gitlab-runner:v17.11.0
    platform: linux/amd64
    depends_on:
      gitlab:
        condition: service_healthy
    volumes:
      - runner-config:/etc/gitlab-runner
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - e2e

  jenkins:
    build:
      context: ./setup
      dockerfile: Dockerfile.jenkins
    ports:
      - "8930:8080"
    volumes:
      - jenkins-data:/var/jenkins_home
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/login"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s
    networks:
      - e2e

volumes:
  gitlab-config:
  gitlab-data:
  runner-config:
  jenkins-data:

networks:
  e2e:
    driver: bridge
